name: BabelDOC B1 candidate runtime
on:
  workflow_dispatch:
  push:
    branches: [fix/beta7-p0-print-deadline]
    paths:
      - 'scripts/babeldoc-runtime/**'
      - '.github/workflows/babeldoc-runtime.yml'
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            assets: '--assets'
          - os: macos-15-intel
            target: macos-x64
            assets: ''
          - os: windows-latest
            target: windows-x64
            assets: ''
          - os: ubuntu-22.04
            target: linux-x64
            assets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify builder safety
        run: python -m unittest discover -s scripts/babeldoc-runtime -p test_builder.py
      - name: Build and relocate official runtime candidate
        run: python scripts/babeldoc-runtime/build.py --target ${{ matrix.target }} --output candidate-output --installer-candidate ${{ matrix.assets }}
      - name: Upload only audit manifests and dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babeldoc-b1-${{ matrix.target }}-audit
          path: candidate-output/reports/
          if-no-files-found: warn
          retention-days: 14
