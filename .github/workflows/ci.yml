name: CI

on:
  push:
    branches:
      - main
      - fix/beta7-p0-print-deadline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result-${{ matrix.os }}
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - run: npm run test:unit
      - run: python3 -m py_compile scripts/docling_local_server.py scripts/local_pdf_server.py
      - run: python3 scripts/test_local_pdf_server.py
      - name: Prepare PDF render audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pdf-regression"
          python3 -m pip install --quiet pymupdf==1.26.6
      - run: npm run test
        env:
          BR_PDF_REGRESSION_DIR: ${{ github.workspace }}/pdf-regression
      - name: Check real printed PDF text and figures
        run: python3 scripts/check_printed_pdf.py pdf-regression/legacy-reflow.pdf
      - name: Upload actual PDF fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-render-regression
          path: pdf-regression/

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Download Zotero for Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "zotero.zip"
          $folder = Join-Path $env:RUNNER_TEMP "zotero"
          Invoke-WebRequest -Uri "https://www.zotero.org/download/client/dl?channel=release&platform=win-x64-zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder
          $app = Get-ChildItem -Path $folder -Filter zotero.exe -Recurse | Select-Object -First 1
          if (!$app) { throw "Zotero executable missing from the Windows ZIP" }
          "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Run regression tests in Zotero
        run: npm run test:review

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs:
      - lint
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: true
      - name: Build release files
        run: npm run build
      - name: Publish versioned XPI release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          XPI=".scaffold/build/bilingual-reader.xpi"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI" --clobber
          else
            gh release create "$TAG" "$XPI" \
              --target "$GITHUB_SHA" \
              --title "Bilingual Reader ${TAG}" \
              --notes "Zotero 10 PDF 阅读模式段落中英对照翻译插件。直接调用 Translate for Zotero 的翻译服务，并已通过 macOS 与 Linux 构建检查。"
          fi
      - name: Publish Zotero update metadata
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_JSON=".scaffold/build/update.json"
          UPDATE_BETA_JSON=".scaffold/build/update-beta.json"
          if gh release view release >/dev/null 2>&1; then
            gh release upload release "$UPDATE_JSON" "$UPDATE_BETA_JSON" --clobber
          else
            gh release create release "$UPDATE_JSON" "$UPDATE_BETA_JSON" \
              --target "$GITHUB_SHA" \
              --title "Bilingual Reader 更新元数据" \
              --notes "供 Zotero 自动更新使用的 update.json 与 update-beta.json。"
          fi
